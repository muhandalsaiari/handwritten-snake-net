    .pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  let at = 0;
  const take = (Type, n) => {
    const arr = new Type(raw, at, n);
    at += n * Type.BYTES_PER_ELEMENT;
    at = Math.ceil(at / 4) * 4;
    return arr;
  };
  LAYERS = META.layers.map(l => ({
    rows: l.rows,
    indptr: take(Int32Array, l.rows + 1),
    indices: take(Int16Array, l.nnz),
    data: take(Int16Array, l.nnz),
    bias: take(Int16Array, l.rows),
  }));
}

// The real forward pass: 207 ReLU layers. Input: head, food, age of each cell.
function decide(body, food) {
  let x = new Float64Array(300);
  x[body[0]] = 1;
  x[CELLS + food] = 1;
  body.forEach((c, i) => { x[2 * CELLS + c] = body.length - i; });
  for (const li of META.order) {
    const l = LAYERS[li], y = new Float64Array(l.rows);
    for (let r = 0; r < l.rows; r++) {
      let s = l.bias[r];
      for (let k = l.indptr[r]; k < l.indptr[r + 1]; k++) s += l.data[k] * x[l.indices[k]];
      y[r] = s > 0 ? s : 0;
    }
    x = y;
  }
  let best = 0;
  for (let m = 1; m < 4; m++) if (x[m] > x[best]) best = m;
  return best;
}

const game = { body: [], food: 0, steps: 0, over: "", wins: 0 };

function placeFood() {
  const free = [];
  for (let c = 0; c < CELLS; c++) if (!game.body.includes(c)) free.push(c);
  game.food = free.length ? free[Math.floor(Math.random() * free.length)] : -1;
}

function reset() {
  game.body = [Math.floor(Math.random() * CELLS)];
  game.steps = 0;
  game.over = "";
  placeFood();
  draw();
}

function step() {
  if (game.over) return;
  const head = game.body[0];
  const m = decide(game.body, game.food);
  const r = Math.floor(head / N) + MOVES[m][0], c = head % N + MOVES[m][1];
  game.steps++;
  if (r < 0 || r >= N || c < 0 || c >= N) { game.over = "Hit a wall"; return; }
  const n = r * N + c, eating = n === game.food;
  if (!eating) game.body.pop();
  if (game.body.includes(n)) { game.over = "Hit itself"; return; }
  game.body.unshift(n);
  if (eating) {
    placeFood();
    if (game.food < 0) { game.over = "Perfect game: board full!"; game.wins++; }
  }
}

const ctx = document.getElementById("board").getContext("2d");
const S = 60;
function cellCentre(c) { return [(c % N) * S + S / 2, Math.floor(c / N) * S + S / 2]; }

function draw() {
  ctx.clearRect(0, 0, 600, 600);
  if (game.food >= 0) {
    const [x, y] = cellCentre(game.food);
    ctx.fillStyle = "#ff6b6b";
    ctx.beginPath(); ctx.arc(x, y, S * 0.3, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = "#3ddc97"; ctx.lineWidth = S * 0.62;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  game.body.forEach((c, i) => { const [x, y] = cellCentre(c); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  if (game.body.length === 1) ctx.lineTo(...cellCentre(game.body[0]));
  ctx.stroke();
  const [hx, hy] = cellCentre(game.body[0]);
  ctx.fillStyle = "#c9ffe6";
  ctx.beginPath(); ctx.arc(hx, hy, S * 0.34, 0, 7); ctx.fill();
  document.getElementById("len").textContent = game.body.length;
  document.getElementById("steps").textContent = game.steps;
  document.getElementById("wins").textContent = game.wins;
  document.getElementById("msg").textContent = game.over;
}

let last = 0, owed = 0;
function loop(t) {
  const speed = +document.getElementById("speed").value;
  owed += Math.min(t - last, 100) * speed * speed / 1000;
  last = t;
  const stop = performance.now() + 12;  // keep the page smooth on slow phones
  while (owed >= 1 && performance.now() < stop) { step(); owed--; }
  owed = Math.min(owed, 2);
  draw();
  requestAnimationFrame(loop);
}

document.getElementById("again").onclick = reset;
window.snake = { game, step, reset };
loadWeights().then(() => { reset(); requestAnimationFrame(loop); window.snake.ready = true; });
</script>
