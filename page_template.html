<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-written Snake net</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
         gap: 14px; padding: 18px; background: #101418; color: #e8edf2;
         font: 16px system-ui, sans-serif; }
  h1 { font-size: 19px; margin: 0; }
  canvas { width: min(92vw, 60vh, 460px); aspect-ratio: 1; border-radius: 10px; background: #1a2026; }
  .stats { display: flex; gap: 22px; }
  .stats b { display: block; font-size: 22px; }
  .stats span { font-size: 13px; color: #9fb0bf; }
  .row { display: flex; gap: 10px; align-items: center; }
  button { font: inherit; padding: 10px 18px; border: 0; border-radius: 8px;
           background: #3ddc97; color: #0c1a14; font-weight: 600; }
  label { font-size: 14px; color: #9fb0bf; }
  #msg { min-height: 22px; font-weight: 600; color: #3ddc97; }
</style>
</head>
<body>
<h1>Snake net: weights written by hand, no training</h1>
<canvas id="board" width="600" height="600"></canvas>
<div class="stats">
  <div><b id="len">1</b><span>length</span></div>
  <div><b id="steps">0</b><span>steps</span></div>
  <div><b id="wins">0</b><span>wins</span></div>
</div>
<div id="msg"></div>
<div class="row">
  <button id="again">New game</button>
  <label>Speed <input id="speed" type="range" min="1" max="60" value="12"></label>
</div>
<script>
const N = 10, CELLS = 100, IN = 400, HID1 = 1300, HID2 = 500;
const MOVES = [[-1, 0], [0, 1], [1, 0], [0, -1]];
let W1, B1, W2, B2, W3;

// Unpack the hand-written weights (gzipped int16, in the order W1 b1 W2 b2 W3).
async function loadWeights() {
  const gz = Uint8Array.from(atob("__WEIGHTS__"), c => c.charCodeAt(0));
  const raw = await new Response(new Blob([gz]).stream()
    .pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  const all = new Int16Array(raw);
  let at = 0;
  const take = n => all.subarray(at, at += n);
  W1 = take(IN * HID1); B1 = take(HID1); W2 = take(HID1 * HID2); B2 = take(HID2); W3 = take(HID2 * 4);
}

// The real forward pass. x has four ones (head, tail, food, length), so layer 1
// is the sum of four rows; only the nonzero layer-1 units feed layer 2.
function decide(head, tail, food, length) {
  const rows = [head, CELLS + tail, 2 * CELLS + food, 3 * CELLS + length - 1].map(r => r * HID1);
  const h2 = Float32Array.from(B2);
  for (let j = 0; j < HID1; j++) {
    const a = W1[rows[0] + j] + W1[rows[1] + j] + W1[rows[2] + j] + W1[rows[3] + j] + B1[j];
    if (a > 0) for (let k = 0, o = j * HID2; k < HID2; k++) h2[k] += a * W2[o + k];
  }
  const logits = [0, 0, 0, 0];
  for (let k = 0; k < HID2; k++) if (h2[k] > 0) for (let m = 0; m < 4; m++) logits[m] += h2[k] * W3[k * 4 + m];
  let best = 0;
  for (let m = 1; m < 4; m++) if (logits[m] > logits[best]) best = m;
  return best;
}

const game = { body: [], food: 0, steps: 0, over: "", wins: 0 };

function placeFood() {
  const free = [];
  for (let c = 0; c < CELLS; c++) if (!game.body.includes(c)) free.push(c);
  game.food = free.length ? free[Math.floor(Math.random() * free.length)] : -1;
}

function reset() {
  game.body = [Math.floor(Math.random() * CELLS)];
  game.steps = 0;
  game.over = "";
  placeFood();
  draw();
}

function step() {
  if (game.over) return;
  const head = game.body[0];
  const m = decide(head, game.body[game.body.length - 1], game.food, game.body.length);
  const r = Math.floor(head / N) + MOVES[m][0], c = head % N + MOVES[m][1];
  game.steps++;
  if (r < 0 || r >= N || c < 0 || c >= N) { game.over = "Hit a wall"; return; }
  const n = r * N + c, eating = n === game.food;
  if (!eating) game.body.pop();
  if (game.body.includes(n)) { game.over = "Hit itself"; return; }
  game.body.unshift(n);
  if (eating) {
    placeFood();
    if (game.food < 0) { game.over = "Perfect game: board full!"; game.wins++; }
  }
}

const ctx = document.getElementById("board").getContext("2d");
const S = 60;
function cellCentre(c) { return [(c % N) * S + S / 2, Math.floor(c / N) * S + S / 2]; }

function draw() {
  ctx.clearRect(0, 0, 600, 600);
  if (game.food >= 0) {
    const [x, y] = cellCentre(game.food);
    ctx.fillStyle = "#ff6b6b";
    ctx.beginPath(); ctx.arc(x, y, S * 0.3, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = "#3ddc97"; ctx.lineWidth = S * 0.62;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  game.body.forEach((c, i) => { const [x, y] = cellCentre(c); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  if (game.body.length === 1) ctx.lineTo(...cellCentre(game.body[0]));
  ctx.stroke();
  const [hx, hy] = cellCentre(game.body[0]);
  ctx.fillStyle = "#c9ffe6";
  ctx.beginPath(); ctx.arc(hx, hy, S * 0.34, 0, 7); ctx.fill();
  document.getElementById("len").textContent = game.body.length;
  document.getElementById("steps").textContent = game.steps;
  document.getElementById("wins").textContent = game.wins;
  document.getElementById("msg").textContent = game.over;
}

let last = 0, owed = 0;
function loop(t) {
  const speed = +document.getElementById("speed").value;
  owed += Math.min(t - last, 100) * speed * speed / 1000;
  last = t;
  while (owed >= 1) { step(); owed--; }
  draw();
  requestAnimationFrame(loop);
}

document.getElementById("again").onclick = reset;
window.snake = { game, step, reset };
loadWeights().then(() => { reset(); requestAnimationFrame(loop); window.snake.ready = true; });
</script>
</body>
</html>
